
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "venv",
    ".venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Python upgrade suggestions
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
